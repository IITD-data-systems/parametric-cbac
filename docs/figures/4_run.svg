<text x="326.5" y="19.0" fill="#9a9ca3" font-size="13" text-anchor="middle">4. Run policies and compare with PostgreSQL</text>
<text x="16" y="59.2" fill="#e6edf3" xml:space="preserve"><tspan fill="#7ee787">$ </tspan>for p in T01 T13 T23 T30; do</text>
<text x="16" y="78.2" fill="#e6edf3" xml:space="preserve">    python3 experiments/run_memento.py --db tpch_sf01 --run-id tpch_sf01 \</text>
<text x="16" y="97.19999999999999" fill="#e6edf3" xml:space="preserve">        experiments/workloads/tpch/$p --check</text>
<text x="16" y="116.2" fill="#e6edf3" xml:space="preserve">  done</text>
